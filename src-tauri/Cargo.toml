[package]
name = "miemiebeep"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "miemiebeep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Windows 窗口嵌入（SetParent 把 Blender 主窗口塞为本应用子窗口）
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
# 这里是一个三方的实现win11 snap-layout的布局的包
# 使用 fork（active_adopt 分支），在 v1.0.9 基础上补丁了 mousedown/mouseup 事件
tauri-plugin-snap-layout = { git = "https://github.com/mydouleur/tauri-plugin-snap-layout", rev = "3f846e3f727552fddebd9f90c616b187ab3a1d54" }

